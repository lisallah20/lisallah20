name: 🔄 Update TryHackMe Badges

on:
  schedule:
    - cron: '0 0 * * *'   # runs every day at midnight UTC
  workflow_dispatch:        # allows manual trigger from GitHub UI

permissions:
  contents: write           # required: allows the workflow to commit & push files

jobs:
  update-thm-badges:
    name: Fetch & commit latest TryHackMe badges
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create badges folder
        run: mkdir -p assets/badges

      - name: Download TryHackMe badge images
        run: |
          BASE="https://assets.tryhackme.com/img/badges"
          BADGES=(
            "leagues-chaos"
            "terminaled"
            "web-fund"
            "blue"
            "metasploitable"
            "owasp-10"
            "burped"
          )
          for badge in "${BADGES[@]}"; do
            echo "Downloading $badge..."
            curl -sL "$BASE/$badge.svg" -o "assets/badges/$badge.svg"
          done

      - name: Commit & push if badges changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badges/
          git diff --cached --quiet || git commit -m "chore: update TryHackMe badges [skip ci]"
          git push
