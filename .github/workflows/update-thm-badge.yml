name: 🔄 Update TryHackMe Badge

on:
  schedule:
    - cron: '0 0 * * *'   # runs every day at midnight UTC
  workflow_dispatch:        # allows manual trigger from GitHub UI

permissions:
  contents: write           # required: allows the workflow to commit & push files

jobs:
  update-thm-badge:
    name: Fetch & commit latest TryHackMe badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # pinned to major version per GitHub docs recommendation

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download TryHackMe badge image
        run: |
          curl -sL "https://tryhackme-badges.s3.amazonaws.com/allathm.png" \
            -o assets/thm_badge.png

      - name: Commit & push if badge changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/thm_badge.png
          git diff --cached --quiet || git commit -m "chore: update TryHackMe badge [skip ci]"
          git push
